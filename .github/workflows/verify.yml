name: Verify
on:
  push:
    branches: [main, "feat/**"]
  pull_request:
    branches: [main]
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Syntax checks
        run: |
          node --check server/research.mjs
          node --check server/app.mjs
          node --check server/index.mjs
          node --check app.js
      - name: Unit and HTTP tests
        run: npm test
